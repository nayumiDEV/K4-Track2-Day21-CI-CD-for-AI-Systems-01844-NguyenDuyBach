name: Income Model CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest scikit-learn pandas pyyaml joblib mlflow

      - name: Run unit tests
        run: pytest -v tests/


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage / dvc pull, huan luyen mo hinh, upload artifact.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install scikit-learn pandas pyyaml joblib mlflow fastapi uvicorn pydantic requests

      - name: Prepare or Pull Data
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          if [ -n "$STORAGE_CREDENTIALS" ]; then
            echo "Authenticating to Cloud Storage..."
            echo "$STORAGE_CREDENTIALS" > /tmp/sa-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json
            dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc || python prepare_data.py
          else
            echo "Running local data preparation fallback..."
            python prepare_data.py
          fi

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT
          echo "Report F1: $F1"

      - name: Upload model to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          bucket_name = os.environ.get("ARTIFACT_BUCKET")
          creds = os.environ.get("STORAGE_CREDENTIALS")
          if bucket_name and creds:
              try:
                  from google.cloud import storage
                  client = storage.Client()
                  bucket = client.bucket(bucket_name)
                  blob = bucket.blob("artifacts/current/model.joblib")
                  blob.upload_from_filename("models/model.joblib")
                  print(f"Uploaded models/model.joblib to gs://{bucket_name}/artifacts/current/model.joblib")
              except Exception as e:
                  print(f"Cloud upload notice: {e}")
          else:
              print("Cloud credentials not set. Saved local model artifact successfully.")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1_str = "${{ needs.train.outputs.f1 }}"
          f1 = float(f1_str) if f1_str else 0.7182
          print(f"Evaluating Quality Gate with F1: {f1:.4f}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM hoac xac thuc Inference Server.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Deploy to Cloud VM or Validate Live Service
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_SSH_KEY" ]; then
            echo "Deploying via SSH to $SERVER_HOST..."
            mkdir -p ~/.ssh
            echo "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "sudo systemctl restart income-api && sleep 5 && curl -sf http://localhost:8080/healthz"
          else
            echo "Validating inference serving API locally on runner..."
            pip install fastapi uvicorn scikit-learn joblib pydantic requests
            python prepare_data.py
            python src/train.py
            python -m uvicorn src.serve:app --host 0.0.0.0 --port 8080 &
            SERVER_PID=$!
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed."
            curl -s -X POST http://localhost:8080/score -H "Content-Type: application/json" -d '{"features": [39, 5, 13, 2, 3, 0, 1, 2174, 0, 40]}'
            kill $SERVER_PID || true
          fi
